<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">MD Masoom Raja — Software Developer</title>
  <desc id="desc">A dark navy and purple gradient banner with abstract glowing orbs and developer-themed circuit lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="52%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#86198F"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#F0ABFC" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <circle cx="1010" cy="75" r="180" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="190" cy="300" r="150" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="#C4B5FD" stroke-opacity=".28" stroke-width="2">
    <path d="M0 80 H120 L160 120 H260 M940 0 V55 L900 95 H820"/>
    <path d="M1200 220 H1080 L1030 170 H970 M300 330 V270 L350 220 H410"/>
    <path d="M790 0 V42 M790 42 H850 M85 220 H150 L190 180"/>
  </g>
  <g fill="#E9D5FF" opacity=".8">
    <circle cx="120" cy="80" r="4"/><circle cx="260" cy="120" r="4"/>
    <circle cx="900" cy="95" r="4"/><circle cx="1030" cy="170" r="4"/>
    <circle cx="350" cy="220" r="4"/><circle cx="150" cy="220" r="4"/>
  </g>
  <path d="M0 255 C230 205 350 310 590 260 S970 205 1200 260 V330 H0Z" fill="url(#wave)"/>
  <path d="M0 278 C250 225 370 330 620 278 S980 225 1200 280" fill="none" stroke="#E9D5FF" stroke-opacity=".35" stroke-width="2"/>
  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="132" fill="#FFFFFF" font-size="57" font-weight="750" letter-spacing="1">MD MASOOM RAJA</text>
    <text x="600" y="181" fill="#E9D5FF" font-size="25" font-weight="600">Software Developer  |  AI &amp; Backend Engineering</text>
    <text x="600" y="222" fill="#DDD6FE" font-size="17" letter-spacing="3">BUILDING • LEARNING • INNOVATING</text>
